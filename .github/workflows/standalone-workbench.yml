name: Standalone workbench

on:
  workflow_dispatch:
  push:
    branches: [codex/standalone-workbench]
    paths: ['standalone/**', '.github/workflows/standalone-workbench.yml']
  pull_request:
    paths: ['standalone/**', '.github/workflows/standalone-workbench.yml']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Zig 0.14.1
        run: python -m pip install ziglang==0.14.1
      - name: Build standalone UI
        shell: pwsh
        run: |
          $zig = python -c "from pathlib import Path; import ziglang; print(Path(ziglang.__file__).parent / 'zig.exe')"
          python standalone/build.py --zig $zig
      - name: Test real Win32 configuration and message handling
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'standalone/dist/windows-self-test.txt'
          $app = Join-Path $PWD 'standalone/dist/WuwaWorkbench.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--self-test', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Self-test timed out' }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Self-test exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'Self-test report was not created' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WuwaWorkbench-standalone-win64
          path: standalone/dist/
          if-no-files-found: error
