name: Build Android Player and Event preview
on:
  workflow_dispatch:
    inputs:
      xapk_url:
        description: Public direct XAPK link (optional; SHA-256 must match the analyzed 2.0.0 file)
        required: false
        default: ""
  push:
    branches: [android-player-event]
    paths: ['mobile/**', '.github/workflows/android-preview.yml']
concurrency:
  group: soravynx-android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SORAVYNX_KEYSTORE: /tmp/soravynx-preview.jks
      SORAVYNX_STORE_PASSWORD: ${{ secrets.SORAVYNX_ANDROID_STORE_PASSWORD }}
      SORAVYNX_KEY_ALIAS: ${{ secrets.SORAVYNX_ANDROID_KEY_ALIAS || 'soravynx' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Require the retained release signing identity
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SORAVYNX_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PYKEY'
          import base64, os
          key = os.environ.get('SIGNING_KEY_BASE64', '')
          password = os.environ.get('SORAVYNX_STORE_PASSWORD', '')
          if not key or not password:
              raise SystemExit('Configure the retained Android signing keystore and password in repository secrets. Refusing to create another disposable public-release key.')
          data = base64.b64decode(''.join(key.split()), validate=True)
          descriptor = os.open(os.environ['SORAVYNX_KEYSTORE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'wb') as stream:
              stream.write(data)
          PYKEY
          keytool -list -keystore "$SORAVYNX_KEYSTORE" -storepass:env SORAVYNX_STORE_PASSWORD -alias "$SORAVYNX_KEY_ALIAS"
      - name: Download and verify the exact game source
        env:
          XAPK_URL: ${{ inputs.xapk_url }}
        run: python mobile/tools/download_game.py /tmp/game.xapk
      - name: Install locked dependencies and run host checks
        run: |
          npm ci --prefix mobile --no-audit --no-fund
          npm --prefix mobile run typecheck
          npm --prefix mobile run lint
          npm --prefix mobile test
          python -m unittest discover -s mobile/tests -p '*_test.py'
          cc -D_GNU_SOURCE -std=c11 -Wall -Wextra -Wno-unused-function -Wno-unused-variable -Imobile/tests/stubs mobile/tests/native_test.c -ldl -o /tmp/soravynx-native-test
          /tmp/soravynx-native-test
      - name: Prepare Android build tools
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build ARM64 runtime and signature-protected bridge
        run: |
          git init /tmp/Dobby
          git -C /tmp/Dobby remote add origin https://github.com/jmpews/Dobby.git
          git -C /tmp/Dobby fetch --depth=1 origin 0527af1b00b8c99cbfdd1efad3ad3fca57fadc60
          git -C /tmp/Dobby checkout --detach FETCH_HEAD
          cmake -S mobile/integration/native -B /tmp/native-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.1.12297006/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DDOBBY_SOURCE_DIR=/tmp/Dobby
          cmake --build /tmp/native-build --target soravynx_game --parallel 2
          mkdir -p /tmp/bridge-classes /tmp/bridge-dex
          javac --release 8 -classpath "$ANDROID_HOME/platforms/android-36/android.jar" -d /tmp/bridge-classes mobile/integration/java/com/soravynx/bridge/*.java
          find /tmp/bridge-classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/36.0.0/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-36/android.jar" --output /tmp/bridge-dex
      - name: Build React Native menu APK
        working-directory: mobile/android
        run: bash gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Assemble integration from the exact analyzed game package
        run: |
          curl --fail --location --retry 2 --max-time 120 -o /tmp/apktool.jar 'https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar'
          echo '66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  /tmp/apktool.jar' | sha256sum --check
          python mobile/tools/package_game.py --xapk /tmp/game.xapk --apktool /tmp/apktool.jar \
            --native /tmp/native-build/libsoravynx_game.so --helper /tmp/bridge-dex/classes.dex \
            --work /tmp/game-integration --output /tmp/game-unaligned.apk
          mkdir -p mobile/dist
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 /tmp/game-unaligned.apk /tmp/game-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$SORAVYNX_KEYSTORE" \
            --ks-pass "pass:$SORAVYNX_STORE_PASSWORD" --ks-key-alias "$SORAVYNX_KEY_ALIAS" \
            --out mobile/dist/StellaSora-SoraVynx-2.0.0-arm64-preview.apk /tmp/game-aligned.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/dist/SoraVynx-Menu-0.1.0-arm64-preview.apk
          cp mobile/INSTALL.vi.md mobile/dist/README.vi.md
      - name: Verify signing, manifests, assets and ARM64 integration
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python mobile/tools/verify_build.py mobile/dist
          cd mobile/dist
          sha256sum *.apk > SHA256SUMS.txt
      - name: Enable emulator KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise release menu and native PopupMenu
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: python mobile/tools/smoke_menu.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SoraVynx-Android-0.1.0-preview.1-arm64
          path: mobile/dist/
          retention-days: 14
          if-no-files-found: warn
