name: Verify Android game startup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-game-startup.yml']
  workflow_dispatch:
    inputs:
      test_source_fix:
        description: Test corrected native bootstrap privately without publishing replacement APKs
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the existing APK pair and exact stock baseline
        run: |
          mkdir -p mobile/dist original startup-results
          curl --fail --location --max-time 120 -o mobile/dist/SoraVynx-Menu-0.1.0-arm64-preview.apk 'https://github.com/bao123e/SoraVynx/releases/download/android-v0.1.0-preview.1/SoraVynx-Menu-0.1.0-arm64-preview.apk'
          curl --fail --location --max-time 120 -o mobile/dist/StellaSora-SoraVynx-2.0.0-arm64-preview.apk 'https://github.com/bao123e/SoraVynx/releases/download/android-v0.1.0-preview.1/StellaSora-SoraVynx-2.0.0-arm64-preview.apk'
          echo '352ca6e91c551e3ad23e24ee124292c9f38510d5d565008d45dadbdd3568c50b  mobile/dist/SoraVynx-Menu-0.1.0-arm64-preview.apk' | sha256sum --check
          echo '7aa399af0bd818245a725fa1127deb9adce2ed88585acc5dde1df516401cfe58  mobile/dist/StellaSora-SoraVynx-2.0.0-arm64-preview.apk' | sha256sum --check
          python mobile/tools/download_game.py /tmp/original.xapk
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/original.xapk') as z:
              for name in ('com.YoStarEN.StellaSora.apk','config.arm64_v8a.apk'):
                  z.extract(name, 'original')
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build and sign an internal bootstrap regression candidate
        if: ${{ inputs.test_source_fix || github.event_name == 'push' }}
        run: |
          cc -D_GNU_SOURCE -std=c11 mobile/tests/bootstrap_test.c -o /tmp/bootstrap-test
          /tmp/bootstrap-test
          python -m unittest discover -s mobile/tests -p '*_test.py'
          sdkmanager 'ndk;27.1.12297006' 'build-tools;36.0.0'
          git init /tmp/Dobby
          git -C /tmp/Dobby remote add origin https://github.com/jmpews/Dobby.git
          git -C /tmp/Dobby fetch --depth=1 origin 0527af1b00b8c99cbfdd1efad3ad3fca57fadc60
          git -C /tmp/Dobby checkout --detach FETCH_HEAD
          cmake -S mobile/integration/native -B /tmp/native-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.1.12297006/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DDOBBY_SOURCE_DIR=/tmp/Dobby
          cmake --build /tmp/native-build --target soravynx_game --parallel 2
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          original = Path('mobile/dist/StellaSora-SoraVynx-2.0.0-arm64-preview.apk')
          with ZipFile(original) as source, ZipFile('/tmp/test-game-unaligned.apk','w') as dest:
              for info in source.infolist():
                  if info.filename.startswith('META-INF/') and info.filename.upper().endswith(('.RSA','.DSA','.EC','.SF','/MANIFEST.MF')):
                      continue
                  data = Path('/tmp/native-build/libsoravynx_game.so').read_bytes() if info.filename == 'lib/arm64-v8a/libsoravynx_game.so' else source.read(info.filename)
                  dest.writestr(info, data)
          PY
          keytool -genkeypair -keystore /tmp/internal-test.jks -storepass internal-test -keypass internal-test -alias internal-test -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Internal Test Only'
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          zipalign -P 16 -f 4 /tmp/test-game-unaligned.apk /tmp/test-game-aligned.apk
          apksigner sign --ks /tmp/internal-test.jks --ks-pass pass:internal-test --out /tmp/test-game.apk /tmp/test-game-aligned.apk
          apksigner sign --ks /tmp/internal-test.jks --ks-pass pass:internal-test --out /tmp/test-menu.apk mobile/dist/SoraVynx-Menu-0.1.0-arm64-preview.apk
          echo 'MODIFIED_GAME_APK=/tmp/test-game.apk' >> "$GITHUB_ENV"
          echo 'MENU_APK=/tmp/test-menu.apk' >> "$GITHUB_ENV"
      - name: Start an isolated test-network relay
        run: |
          python mobile/tools/test_network_proxy.py /tmp/proxy-connections.jsonl > /tmp/proxy-service.txt 2>&1 &
          echo "TEST_PROXY_PID=$!" >> "$GITHUB_ENV"
      - name: Install packet-summary parser
        run: python -m pip install dpkt==1.9.8
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -tcpdump /tmp/soravynx-network.pcap
          script: python mobile/tools/smoke_game_startup.py
      - name: Summarize game network connectivity without packet bodies
        if: always()
        run: |
          python mobile/tools/network_summary.py /tmp/soravynx-network.pcap startup-results/network-summary.json
          if [ -f /tmp/proxy-connections.jsonl ]; then cp /tmp/proxy-connections.jsonl startup-results/; fi
          if [ -n "$TEST_PROXY_PID" ]; then kill "$TEST_PROXY_PID" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-startup-api-${{ matrix.api }}
          path: startup-results/
          if-no-files-found: warn
          retention-days: 7
