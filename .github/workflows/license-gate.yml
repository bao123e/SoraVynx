name: Verify Windows license gate
on:
  workflow_dispatch:
  push:
    branches: [feature/license-gate, feature/key-recovery, fix/startup-compatibility-report, fix/dorm-claim-gifts, fix/claim-gifts-marked-click, feature/daily-dispatch-preview, feature/commission-ui-steps, fix/claim-all-double-click]
    paths: ['source/**', 'licensing/**', '.github/workflows/license-gate.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - name: Test owner issuer and compile the locked tool
        run: |
          node --test licensing/test/issuer.test.mjs
          python source/build.py --zig zig
      - name: Verify startup status and clipboard on Windows without game execution
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -O2 -UNDEBUG -std=c11 -Wall -Wextra -Werror -Wno-unused-function source/tests/startup_windows_test.c source/api.c source/backend.c source/vendor/minhook/src/hook.c source/vendor/minhook/src/buffer.c source/vendor/minhook/src/trampoline.c source/vendor/minhook/src/hde/hde64.c source/dist/ui.res -Isource/vendor/minhook/include -lgdiplus -lcomdlg32 -lmsimg32 -luser32 -lgdi32 -lkernel32 -lbcrypt -lwinhttp -lcrypt32 -ladvapi32 -o "$env:RUNNER_TEMP/startup-test.exe"
          & "$env:RUNNER_TEMP/startup-test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Startup status/clipboard regression failed' }
      - name: Verify deferred Lua bridge and report clipboard
        run: python source/test_report_windows.py --zig zig
      - name: Test real English OCR and Commission action planning without game input
        shell: powershell
        run: ./source/vision/commission.ps1 -SelfTest
      - name: Prepare ephemeral issuer and native verifier
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP 'license-fixtures'
          node licensing/test/make-fixtures.mjs $fixtures
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Werror -Wno-unused-function -I $fixtures source/tests/license_verify.c -lbcrypt -lcrypt32 -ladvapi32 -lwinhttp -luser32 -lgdi32 -o "$fixtures/verifier.exe"
          & "$fixtures/verifier.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native signature verification failed' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'license-ui-data'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & "$fixtures/verifier.exe" --ui "$fixtures/ui-key.txt" "$fixtures/ui-record.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native activation gate UI test failed' }
      - name: Keep signing material private
        run: Write-Output 'Only public issuer data is compiled into the tool. No signing secrets or ephemeral test keys are uploaded.'
      - name: Check production issuer configuration
        id: issuer
        shell: pwsh
        run: |
          $configured = (Get-Content source/license_public_key.h -Raw) -match '#define SV_LICENSE_CONFIGURED 1'
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Verify HTTPS transport and rejection of the previous issuer
        if: steps.issuer.outputs.configured == 'true'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'owner-record-probe.exe'
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Werror -Wno-unused-function source/tests/owner_record_probe.c -lbcrypt -lwinhttp -lcrypt32 -ladvapi32 -luser32 -lgdi32 -o $probe
          & $probe --reject-old '2d32d428884b06bd0f5c2be5245c640a75c477ef67c90de071b4188dd364dde1'
          if ($LASTEXITCODE -ne 0) { throw 'Previous issuer rejection or HTTPS transport verification failed' }
      - name: Verify the actual customer launcher remains locked for a wrong issuer
        if: steps.issuer.outputs.configured == 'true'
        run: python licensing/test/customer_gate_windows.py source/dist/SoraVynx.exe "${{ runner.temp }}/license-fixtures/ui-key.txt"
      - name: Package the customer binary pair
        if: steps.issuer.outputs.configured == 'true'
        run: python licensing/package_customer.py
      - name: Publish owner-configured Windows preview
        if: steps.issuer.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python -c "import json; print(json.load(open('source/dist/build.json'))['version'])")"
          cat > "$RUNNER_TEMP/customer-notes.md" <<'NOTES'
          Auto Commission OCR preview: the owner confirmed manual-step Claim All / Dispatch Again and daily Dispatch 1/1. This build adds one bounded screen-driven Commission run: open Commission from the main screen if recognized, Claim All, skip a recognized story only when Esc Skip and Space Next are both visible, dismiss a recognized Items Obtained overlay, then click Dispatch Again once. It does not select teams manually or invoke guessed game APIs.

          Extract the WHOLE ZIP including automation/commission.ps1 next to the EXE/DLL. Use the existing key, enter the game main screen or Commission and wait for READY. Auto Daily -> leave Dispatch 1 commission at USE -> Auto Commission. No F9 calibration is needed for this module. Keep the game foreground and avoid moving/resizing the game. F1 or Disable all stops the run and releases an owned mouse/Escape press. If no rewards are ready, the screen is unknown, English OCR is unavailable, or the helper/script does not match the binary, the run stops instead of guessing input.

          English UI and Windows built-in English OCR are required. All capture/OCR stays local and in memory; no screenshot or recognized account text is saved, uploaded or printed. Only enumerated progress/held-input codes cross a private pipe. The native launcher validates the script against the DLL resource and holds a read lock for the child lifetime. A private kill-on-close job controls helper cleanup, with explicit inherited standard handles only. Player/Event backend, public issuer and bot/payment configuration are unchanged.

          Tests: real Windows OCR on synthetic home/claim/story/items/result screens, bounded action planning, no repeat Dispatch Again, unknown/disabled-screen rejection; native helper protocol/script pinning plus existing input, startup/clipboard, license and native backend regressions. Live-game screen recognition of this NEW automatic module is unverified. Input completion is not automatic server/quest verification. This covers Commission only, not the full Auto Daily chain.
          NOTES
          gh release create "$tag" "$RUNNER_TEMP/SoraVynx-${tag#v}-win64.zip" "$RUNNER_TEMP/SoraVynx-${tag#v}-win64.zip.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SoraVynx $tag - Auto Commission OCR preview" --notes-file "$RUNNER_TEMP/customer-notes.md" --prerelease --latest=false
      - name: Upload owner-configured customer build only
        if: steps.issuer.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SoraVynx-Windows-license-preview
          path: |
            source/dist/SoraVynx.exe
            source/dist/SoraVynx.Runtime.dll
            source/dist/build.json
          if-no-files-found: error
