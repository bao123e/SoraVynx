name: Verify Windows license gate
on:
  workflow_dispatch:
  push:
    branches: [feature/license-gate]
    paths: ['source/**', 'licensing/**', '.github/workflows/license-gate.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - name: Test owner issuer and compile the locked tool
        run: |
          node --test licensing/test/issuer.test.mjs
          python source/build.py --zig zig
      - name: Prepare ephemeral issuer and native verifier
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP 'license-fixtures'
          node licensing/test/make-fixtures.mjs $fixtures
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Werror -Wno-unused-function -I $fixtures source/tests/license_verify.c -lbcrypt -lcrypt32 -ladvapi32 -luser32 -lgdi32 -o "$fixtures/verifier.exe"
          & "$fixtures/verifier.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native signature verification failed' }
          $device = & "$fixtures/verifier.exe" --device
          node licensing/issuer.mjs issue --private "$fixtures/fixture-private.pem" --machine $device --plan week | Set-Content -NoNewline -Encoding ascii "$fixtures/ui-key.txt"
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'license-ui-data'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & "$fixtures/verifier.exe" --ui "$fixtures/ui-key.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native activation gate UI test failed' }
      - name: No production signing key or customer binary is published
        run: Write-Output 'Tests use a disposable issuer. Default customer build remains fail-closed until owner configures a public key. No issuer secrets or ephemeral test keys are uploaded.'
      - name: Check production issuer configuration
        id: issuer
        shell: pwsh
        run: |
          $configured = (Get-Content source/license_public_key.h -Raw) -match '#define SV_LICENSE_CONFIGURED 1'
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Upload owner-configured customer build only
        if: steps.issuer.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SoraVynx-Windows-license-preview
          path: |
            source/dist/SoraVynx.exe
            source/dist/SoraVynx.Runtime.dll
            source/dist/build.json
          if-no-files-found: error
