name: Verify Windows license gate
on:
  workflow_dispatch:
  push:
    branches: [feature/license-gate, feature/key-recovery, fix/startup-compatibility-report, fix/dorm-claim-gifts, fix/claim-gifts-marked-click, feature/daily-dispatch-preview, feature/commission-ui-steps, fix/claim-all-double-click, feature/commission-vision]
    paths: ['source/**', 'licensing/**', '.github/workflows/license-gate.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - name: Test owner issuer and compile the locked tool
        run: |
          node --test licensing/test/issuer.test.mjs
          python source/build.py --zig zig
      - name: Verify startup status and clipboard on Windows without game execution
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -O2 -UNDEBUG -std=c11 -Wall -Wextra -Werror -Wno-unused-function source/tests/startup_windows_test.c source/api.c source/backend.c source/vendor/minhook/src/hook.c source/vendor/minhook/src/buffer.c source/vendor/minhook/src/trampoline.c source/vendor/minhook/src/hde/hde64.c source/dist/ui.res -Isource/vendor/minhook/include -lgdiplus -lcomdlg32 -lcomctl32 -lmsimg32 -luser32 -lgdi32 -lkernel32 -lbcrypt -lwinhttp -lcrypt32 -ladvapi32 -o "$env:RUNNER_TEMP/startup-test.exe"
          & "$env:RUNNER_TEMP/startup-test.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Startup status/clipboard regression failed' }
      - name: Verify deferred Lua bridge and report clipboard
        run: python source/test_report_windows.py --zig zig
      - name: Test real English OCR and Commission action planning without game input
        shell: powershell
        run: ./source/vision/commission.ps1 -SelfTest
      - name: Prepare ephemeral issuer and native verifier
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP 'license-fixtures'
          node licensing/test/make-fixtures.mjs $fixtures
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Werror -Wno-unused-function -I $fixtures source/tests/license_verify.c -lbcrypt -lcrypt32 -ladvapi32 -lwinhttp -luser32 -lgdi32 -o "$fixtures/verifier.exe"
          & "$fixtures/verifier.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Native signature verification failed' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'license-ui-data'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & "$fixtures/verifier.exe" --ui "$fixtures/ui-key.txt" "$fixtures/ui-record.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native activation gate UI test failed' }
      - name: Keep signing material private
        run: Write-Output 'Only public issuer data is compiled into the tool. No signing secrets or ephemeral test keys are uploaded.'
      - name: Check production issuer configuration
        id: issuer
        shell: pwsh
        run: |
          $configured = (Get-Content source/license_public_key.h -Raw) -match '#define SV_LICENSE_CONFIGURED 1'
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Verify HTTPS transport and rejection of the previous issuer
        if: steps.issuer.outputs.configured == 'true'
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'owner-record-probe.exe'
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Werror -Wno-unused-function source/tests/owner_record_probe.c -lbcrypt -lwinhttp -lcrypt32 -ladvapi32 -luser32 -lgdi32 -o $probe
          & $probe --reject-old '2d32d428884b06bd0f5c2be5245c640a75c477ef67c90de071b4188dd364dde1'
          if ($LASTEXITCODE -ne 0) { throw 'Previous issuer rejection or HTTPS transport verification failed' }
      - name: Verify the actual customer launcher remains locked for a wrong issuer
        if: steps.issuer.outputs.configured == 'true'
        run: python licensing/test/customer_gate_windows.py source/dist/SoraVynx.exe "${{ runner.temp }}/license-fixtures/ui-key.txt"
      - name: Package the customer binary pair
        if: steps.issuer.outputs.configured == 'true'
        run: python licensing/package_customer.py
      - name: Publish owner-configured Windows preview
        if: steps.issuer.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(python -c "import json; print(json.load(open('source/dist/build.json'))['version'])")"
          cat > "$RUNNER_TEMP/customer-notes.md" <<'NOTES'
          Auto Daily and menu preview: Disc/Trekker candidates at levels 1–89 are eligible; levels >=90 are skipped. Each upgrade uses Upgrade 1 level and one final confirmation, then closes Power Up at the lower dark backdrop, verifies the cleared cost/new level and returns home. The owner has observed real Disc and Trekker Power Up results; changes in this release still require live-game verification.

          Live actions now require two matching observations at least 400 ms apart, wait up to 30 seconds per transition, and stop after six minutes total. Unknown or unreadable numeric frames do not authorize input. Navigation may retry within its bound; the final upgrade confirmation is never repeated. Unreadable editor levels additionally use a narrow yellow/green current-counter crop that excludes /cap, XP and neighboring ascension diamonds; two-digit 13/35/89/90 fixtures cover both editor profiles. Inspect reports whether another OS window covers the level region. Close error dialogs before inspecting.

          The menu starts hidden and remains centered on the game client. F1 shows/hides and stops Auto Daily; F6/F7/F8 retain Event shortcuts; F9 retains manual point marking. Ctrl+Alt+1..5 toggle the five Player features, Ctrl+Alt+9 starts/stops selected daily steps, Ctrl+Alt+0 disables all. The Keybinds button now edits all twelve shortcuts using native hotkey fields with Save, Cancel and Reset defaults. Bindings persist in config.ini; duplicate/unavailable shortcuts reject Save and preserve the previous configuration. All listed keys are initial defaults and can be changed. Feature shortcuts require the game or menu foreground.

          Extract the WHOLE ZIP, preserving automation/commission.ps1 beside EXE/DLL. Exit the old game/tool first, use the existing key, press F1 and wait for READY. Start on Home, select supported USE/SKIP steps in Auto Daily, then Run selected daily steps. Home interaction, Disc, Trekker and Commission are supported previews; Shop remains skipped. Keep the game foreground and avoid resizing it. Local OCR uses memory only; no screenshot, account text or log is saved. Issuer and access keys are unchanged.
          NOTES
          gh release create "$tag" "$RUNNER_TEMP/SoraVynx-${tag#v}-win64.zip" "$RUNNER_TEMP/SoraVynx-${tag#v}-win64.zip.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SoraVynx $tag - Daily wait and centered menu preview" --notes-file "$RUNNER_TEMP/customer-notes.md" --prerelease --latest=false
      - name: Upload owner-configured customer build only
        if: steps.issuer.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SoraVynx-Windows-license-preview
          path: |
            source/dist/SoraVynx.exe
            source/dist/SoraVynx.Runtime.dll
            source/dist/build.json
          if-no-files-found: error
